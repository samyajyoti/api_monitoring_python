<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — DC-Monitoring</title>
  <link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo-grafana" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="28" fill="url(#logoGrad)"/>
        <path d="M32 14c-6 8-10 16-10 18s4 10 10 18c6-8 10-16 10-18s-4-10-10-18z" fill="#1f1f23" opacity="0.85"/>
        <circle cx="32" cy="32" r="6" fill="#1f1f23"/>
        <defs>
          <linearGradient id="logoGrad" x1="8" y1="8" x2="56" y2="56">
            <stop stop-color="#f79520"/>
            <stop offset="0.5" stop-color="#f46800"/>
            <stop offset="1" stop-color="#e55400"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 class="login-title">Welcome to DC-Monitoring</h1>

    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <div class="form-field">
        <label for="username">Email or username</label>
        <input id="username" type="text" name="username" required autofocus autocomplete="username">
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="password-field">
          <input id="password" type="password" name="password" required autocomplete="current-password">
          <button type="button" class="toggle-password" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none">
              <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none">
              <path d="M3 3l18 18M10.6 10.6A4 4 0 0 0 12 16a4 4 0 0 0 3.4-1.8M6.7 6.7C4.6 8.1 3 10 2 12s4 7 10 7c1.8 0 3.5-.4 5-1.2M14.1 5.2C13.4 5.1 12.7 5 12 5 6 5 2 12 2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-grafana-login">Log in</button>
    </form>
  </div>

  <script>
    document.querySelector(".toggle-password")?.addEventListener("click", () => {
      const input = document.getElementById("password");
      const eye = document.querySelector(".icon-eye");
      const eyeOff = document.querySelector(".icon-eye-off");
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      eye.classList.toggle("hidden", hidden);
      eyeOff.classList.toggle("hidden", !hidden);
    });
  </script>
</body>
</html>
