services:
  dashboard:
    build: .
    container_name: mon-dashboard
    ports:
      - "8081:8081"
    volumes:
      - dashboard-data:/app/data
    environment:
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard-data:
